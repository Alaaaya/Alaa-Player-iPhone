name: Unverified iPhone test package
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ios-unverified.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && mkdir -p artifacts && npm run check && npm run build
      - run: brew install xcodegen
      - name: Package without simulator verification
        run: |
          cp -R dist ios/www
          cd ios
          printf '{}' > test-provider.json
          xcodegen generate
          xcodebuild -project AlaaPlayer.xcodeproj -scheme AlaaPlayer -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AlaaPlayer.app Payload/
          test -f Payload/AlaaPlayer.app/www/index.html
          test -f Payload/AlaaPlayer.app/AlaaPlayer
          ditto -c -k --sequesterRsrc --keepParent Payload ../Alaa-Player-2.6.8-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Alaa-Player-2.6.8-UNVERIFIED-unsigned
          path: Alaa-Player-2.6.8-unsigned.ipa
