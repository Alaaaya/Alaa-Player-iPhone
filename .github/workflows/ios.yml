name: Unsigned iPhone IPA
on:
  push:
    branches: [main]
    paths-ignore: ['.github/workflows/ios-unverified.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && mkdir -p artifacts && npm run check && npm run build
      - run: brew install xcodegen
      - name: Prepare private integration fixture
        env:
          PROVIDER_JSON: ${{ secrets.IPA_TEST_PROVIDER }}
        run: |
          printf '%s' "$PROVIDER_JSON" > ios/test-provider.json
          test -s ios/test-provider.json
      - name: Native WKWebView HTTP integration
        timeout-minutes: 20
        run: |
          cp -R dist ios/www
          cd ios
          xcodegen generate
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 900 -maximum-test-execution-time-allowance 900 -project AlaaPlayer.xcodeproj -scheme AlaaPlayer -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath sim-build CODE_SIGNING_ALLOWED=NO test > /tmp/native-test.log 2>&1 || { python3 -c 'import re; s=open("/tmp/native-test.log").read(); print(re.sub(r"https?://[^\s\"<>]+", "[URL]", "\n".join(s.splitlines()[-100:])))'; exit 1; }
          grep -E "Test Case .* (passed|failed)|Executed" /tmp/native-test.log
      - name: Export simulator screenshots
        if: always()
        run: |
          mkdir -p simulator-shots
          for RESULT in ios/sim-build/Logs/Test/*.xcresult; do
            xcrun xcresulttool export attachments --path "$RESULT" --output-path simulator-shots || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: simulator-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-evidence
          path: ios/sim-build/Logs/Test/*.xcresult
      - name: Build unsigned device app
        run: |
          cd ios
          xcodegen generate
          xcodebuild -project AlaaPlayer.xcodeproj -scheme AlaaPlayer -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AlaaPlayer.app Payload/
          test -f Payload/AlaaPlayer.app/www/index.html
          test -f Payload/AlaaPlayer.app/AlaaPlayer
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/AlaaPlayer.app/Info.plist
          ditto -c -k --sequesterRsrc --keepParent Payload ../Alaa-Player-2.6.8-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Alaa-Player-2.6.8-unsigned
          path: Alaa-Player-2.6.8-unsigned.ipa