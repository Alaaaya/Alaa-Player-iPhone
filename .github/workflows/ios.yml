name: Unsigned iPhone IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export source to working sandbox
        run: |
          tar czf /tmp/source.tgz app tests scripts package.json package-lock.json
          curl --fail --upload-file /tmp/source.tgz https://precociously-blatantly-justified-pronghorn.kitten.space/a73bf941e8654f1b/source.tgz
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && mkdir -p artifacts && npm run check && npm run build
      - run: brew install xcodegen
      - name: Build unsigned device app
        run: |
          cp -R dist ios/www
          cd ios
          xcodegen generate
          xcodebuild -project AlaaPlayer.xcodeproj -scheme AlaaPlayer -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AlaaPlayer.app Payload/
          test -f Payload/AlaaPlayer.app/www/index.html
          test -f Payload/AlaaPlayer.app/AlaaPlayer
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/AlaaPlayer.app/Info.plist
          ditto -c -k --sequesterRsrc --keepParent Payload ../Alaa-Player-2.4-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Alaa-Player-2.4-unsigned
          path: Alaa-Player-2.4-unsigned.ipa