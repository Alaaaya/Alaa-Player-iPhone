name: Build TikTokGlass
on:
  push:
    branches: [tiktok-glass]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive
      - name: Tools
        run: brew install ldid make dpkg
      - name: Build
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          gmake package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mkdir -p out
          cp packages/*.deb out/
          cp .theos/obj/TikTokGlass.dylib out/ || find .theos -name 'TikTokGlass.dylib' -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: TikTokGlass
          path: out/
      - name: Publish build to tiktok-glass-out branch
        run: |
          cd out
          git init -q -b tiktok-glass-out
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build ${{ github.sha }}"
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git tiktok-glass-out
