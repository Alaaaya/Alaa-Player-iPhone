name: AlaaPlayer
options:
  bundleIdPrefix: com.alaa
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  AlaaPlayer:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: www
        type: folder
        buildPhase: resources
      - path: native-fetch.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alaa.player.web
        PRODUCT_NAME: AlaaPlayer
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "2.4"
        CURRENT_PROJECT_VERSION: "24"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Alaa Player
        CFBundleShortVersionString: "2.4"
        CFBundleVersion: "24"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
        NSLocalNetworkUsageDescription: Connect to your own IPTV server on your local network.