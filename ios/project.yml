name: AlaaPlayer
options:
  bundleIdPrefix: com.alaa
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
packages:
  VLCKit:
    url: https://code.videolan.org/videolan/VLCKit.git
    exactVersion: 4.0.0-a22
targets:
  AlaaPlayer:
    type: application
    platform: iOS
    dependencies:
      - package: VLCKit
    sources:
      - Sources
      - path: Licenses
        type: folder
        buildPhase: resources
      - path: www
        type: folder
        buildPhase: resources
      - path: native-player.js
        buildPhase: resources
      - path: native-fetch.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alaa.player.web
        PRODUCT_NAME: AlaaPlayer
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "2.5"
        CURRENT_PROJECT_VERSION: "25"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Alaa Player
        CFBundleShortVersionString: "2.5"
        CFBundleVersion: "25"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Connect to your own IPTV server on your local network.
  NativeBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - path: test-provider.json
        buildPhase: resources
    dependencies:
      - target: AlaaPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alaa.player.web.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AlaaPlayer.app/AlaaPlayer"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  AlaaPlayer:
    build:
      targets:
        AlaaPlayer: all
        NativeBridgeTests: [test]
    test:
      targets: [NativeBridgeTests]
